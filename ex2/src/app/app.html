<h1>User List Page</h1>

<app-search-user (searchChanged)="handleSearch($event)"></app-search-user>

@for (user of filteredUsers; track user.email) {
  <app-user-row [name]="user.name" [email]="user.email" [role]="user.role" [imgURL]="user.imgURL" />
} @empty {
  <p style="text-align: center; margin-top: 20px">No users found!</p>
}
